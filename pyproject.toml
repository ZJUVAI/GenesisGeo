[build-system]
requires = [
    "setuptools>=45",
    "wheel",
    "setuptools_scm[toml]>=6.2",
    "pybind11",
    "cmake",
]

[project]
name = "newclid"
dynamic = ["version", "readme"]
description = "Symbolic solver for geometric problems."
requires-python = "==3.10.*"
classifiers=[
    'Intended Audience :: Science/Research',
    'Intended Audience :: Developers',
    'Topic :: Software Development',
    'Topic :: Scientific/Engineering',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: Unix',
    'Operating System :: MacOS',
]
dependencies = [
    "ray[default]",
    "millify",
    "numpy",
    "cairosvg",
    "matplotlib>=3.7.0",
    "markupsafe==3.0.2",
    "pyvis",
    "scipy>=1.15",
    "adjusttext @ https://gh-proxy.org/https://github.com/Phlya/adjustText/archive/master.zip",
    "pandas>=2.3",
    "pybind11",
    "httpx[socks]",
]

[project.optional-dependencies]
dev = ['black', 'ruff', 'pytest', 'pytest-cov', 'pytest-check', 'pytest-mock', 'pre-commit', 'rich']
gpu = ['torch==2.8.0', 'torchvision', 'transformers<5.4.0', 'accelerate',
       'flash-attn', 'ms-swift', 'deepspeed<0.19', 'vllm>=0.5.1', 'liger_kernel',
       'qwen-vl-utils']
doc = ['sphinx-autoapi', 'autoapi', 'sphinx_rtd_theme', 'sphinx-autodoc-typehints', 'sphinx-autobuild']
full = ['newclid[gpu,dev,doc]']

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
flash-attn = { MAX_JOBS = "10" }  # FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE"; remove if you need to compile flash attn from source

[[tool.uv.index]]
url = "http://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
name = "tsinghua"
default = true

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu126"
name = "pytorch"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.setuptools]
license-files = ['LICEN[CS]E*', 'COPYING*', 'NOTICE*', 'AUTHORS*']

[project.scripts]
newclid = "newclid.__main__:main"

[tool.setuptools.dynamic]
readme = { file = ["README.md"] }

[tool.setuptools_scm]

[tool.pytest.ini_options]
filterwarnings = [
    'ignore:distutils Version classes are deprecated:DeprecationWarning',
    'ignore:`np.bool8` is a deprecated alias for `np.bool_`:DeprecationWarning',
    'ignore:Training and eval env are not of the same type:UserWarning',
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ['src']

[tool.coverage.report]
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",

    # Don't complain about typing imports, they aren't run:
    "if TYPE_CHECKING:",

    # Don't complain about optional imports, they don't matter for now:
    "except ImportError:"
]
